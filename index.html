<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;
  --bg2:#0a0a0a;
  --card:rgba(28,28,30,0.72);
  --card-hover:rgba(38,38,42,0.8);
  --card-border:rgba(255,255,255,0.06);
  --glass:rgba(28,28,30,0.88);
  --glass-border:rgba(255,255,255,0.08);
  --accent:#0A84FF;
  --accent2:#5E5CE6;
  --accent-grad:linear-gradient(135deg,#0A84FF,#5E5CE6);
  --accent-dim:rgba(10,132,255,0.15);
  --accent2-dim:rgba(94,92,230,0.12);
  --green:#30D158;
  --green-dim:rgba(48,209,88,0.15);
  --blue:#0A84FF;
  --blue-dim:rgba(10,132,255,0.15);
  --red:#FF453A;
  --red-dim:rgba(255,69,58,0.12);
  --orange:#FF9F0A;
  --orange-dim:rgba(255,159,10,0.12);
  --text:#F5F5F7;
  --text2:rgba(255,255,255,0.56);
  --text3:rgba(255,255,255,0.32);
  --surface:rgba(255,255,255,0.04);
  --shadow:none;
  --shadow-lg:none;
  --shadow-accent:none;
  --r:16px;
  --rs:12px;
  --rxs:8px;
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,'SF Pro Display','SF Pro Text','DM Sans','Helvetica Neue',sans-serif;
  color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;background:#000;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:url('bg.jpg') center/cover no-repeat;
  opacity:0.35;will-change:auto;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;
  background:linear-gradient(to bottom,rgba(0,0,0,0.5) 0%,rgba(0,0,0,0.7) 100%);
  will-change:auto;-webkit-backface-visibility:hidden;backface-visibility:hidden;
}

/* ═══ BACKGROUND ═══ */

/* ═══ LOGIN ═══ */
.login{
  position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;
  transition:opacity .6s,transform .6s cubic-bezier(.4,0,.2,1);
  background:transparent;
}
.login.out{opacity:0;transform:scale(1.08);pointer-events:none}
.login-card{
  background:rgba(28,28,30,0.65);border:1px solid rgba(255,255,255,0.08);
  -webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);
  border-radius:24px;padding:40px 28px;width:100%;max-width:380px;
  text-align:center;
}
.login-icon{
  width:64px;height:64px;border-radius:16px;margin:0 auto 20px;
  background:var(--accent-grad);display:flex;align-items:center;justify-content:center;
  color:#fff;
}
.login-title{
  font-size:28px;font-weight:700;color:var(--text);
  margin-bottom:4px;letter-spacing:-0.5px;
}
.login-sub{color:var(--text3);font-size:13px;letter-spacing:0.5px;margin-bottom:28px}
.login-btn{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:13px 20px;border-radius:var(--rs);border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.07);color:var(--text);font-size:14px;font-weight:500;
  cursor:pointer;transition:all .2s;justify-content:center;
}
.login-btn:hover{background:rgba(255,255,255,0.12)}
.login-btn:active{transform:scale(.98)}
.login-btn svg{width:20px;height:20px;flex-shrink:0}
.login-sep{
  color:var(--text3);font-size:11px;margin:18px 0;letter-spacing:2px;
  display:flex;align-items:center;gap:14px;text-transform:uppercase;
}
.login-sep::before,.login-sep::after{content:'';flex:1;height:1px;background:var(--card-border)}
.login-form{display:flex;flex-direction:column;gap:10px;text-align:left}
.login-form input{
  padding:12px 16px;border-radius:var(--rs);border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.06);color:var(--text);font-size:14px;
  transition:border-color .2s;
}
.login-form input:focus{outline:none;border-color:var(--accent)}
.login-form input::placeholder{color:var(--text3)}
.login-submit{
  padding:13px;border:none;border-radius:var(--rs);
  background:var(--accent);color:#fff;
  font-size:15px;font-weight:600;
  cursor:pointer;transition:opacity .2s;
}
.login-submit:hover{opacity:0.85}
.login-submit:active{transform:scale(.97)}
.login-toggle{
  margin-top:6px;color:var(--accent);font-size:13px;background:none;border:none;
  cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;text-align:center;width:100%;
}
.login-toggle:hover{text-decoration:underline}
.login-err{color:var(--red);font-size:12px;text-align:center;min-height:20px;margin-top:8px}
.login-load{color:var(--text3);font-size:13px;margin-top:8px;display:none;text-align:center}
.login-guest{
  width:100%;padding:13px;border-radius:var(--rs);
  border:1px solid rgba(255,255,255,0.1);background:transparent;
  color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;
}
.login-guest:hover{background:rgba(255,255,255,0.06);color:var(--text)}
.login-guest-note{font-size:11px;color:var(--text3);text-align:center;margin-top:8px}

/* ═══ APP ═══ */
.app{position:relative;z-index:2;max-width:680px;margin:0 auto;padding:0 20px 40px;display:none}
@media(min-width:768px){
  .app{padding:0 32px 40px}
  .exc{padding:20px}
  .banner{padding:20px 24px}
  .cycle{padding:16px 14px}
  .ex-sets-hdr,.ex-set-row{grid-template-columns:32px 1fr 1fr;gap:10px}
  .inp-g input{padding:12px 14px;font-size:15px}
  .tabs button{padding:12px 0;font-size:14px}
  .hdr-logo h1{font-size:22px}
  .p-card,.h-entry,.r-card{padding:24px}
  .login-card{padding:48px 40px;max-width:440px}
}
.app.on{display:block;animation:appIn .7s cubic-bezier(.4,0,.2,1) both}
.app-loading{
  display:flex;align-items:center;justify-content:center;
  padding:80px 20px;color:var(--text3);font-size:14px;
}
.app-loading .spinner{
  width:20px;height:20px;border:2px solid var(--text3);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;margin-right:10px;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes appIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

/* ═══ HEADER ═══ */
.hdr{
  padding:20px 0 14px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  background:rgba(0,0,0,0.85);
}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-logo-icon{
  width:32px;height:32px;border-radius:8px;background:var(--accent-grad);
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.hdr-logo h1{
  font-size:18px;font-weight:700;color:var(--text);letter-spacing:-0.3px;
}
.hdr-right{display:flex;align-items:center;gap:8px}
.sync{width:8px;height:8px;border-radius:50%;background:var(--green)}
.sync.s{animation:syncP 1s infinite}
.sync.off{background:var(--orange)}
@keyframes syncP{0%,100%{opacity:1}50%{opacity:.3}}
.ibtn{
  width:36px;height:36px;border-radius:10px;border:none;
  background:rgba(255,255,255,0.08);color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .2s;font-size:16px;
}
.ibtn:hover{background:rgba(255,255,255,0.14)}
.avatar{width:32px;height:32px;border-radius:50%;cursor:pointer;object-fit:cover}
.av-init{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;background:rgba(255,255,255,0.1);color:var(--text2);cursor:pointer;
}

/* ═══ TABS ═══ */
.tabs{
  display:flex;gap:2px;padding:3px;
  background:rgba(118,118,128,0.2);border-radius:10px;margin-bottom:16px;
}
.tabs button{
  flex:1;padding:8px 0;border:none;border-radius:8px;
  font-size:13px;font-weight:500;
  color:var(--text2);background:transparent;cursor:pointer;
  transition:all .2s;
}
.tabs button.on{
  color:var(--text);background:rgba(255,255,255,0.12);
}
.tabs button:not(.on):hover{color:var(--text)}

/* ═══ CYCLE ═══ */
.cycle{
  display:flex;gap:4px;margin-bottom:16px;padding:12px 8px;
  background:rgba(28,28,30,0.88);border:1px solid rgba(255,255,255,0.06);border-radius:14px;
  
}
.cd{
  flex:1;text-align:center;padding:10px 2px;border-radius:var(--rs);
  cursor:pointer;transition:all .25s;border:1.5px solid transparent;
}
.cd:hover{background:rgba(255,255,255,0.06)}
.cd.on{background:rgba(10,132,255,0.15);border-color:rgba(10,132,255,0.3)}
.cd .n{font-size:16px;font-weight:700;display:block;line-height:1}
.cd .l{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;display:block;font-weight:600}
.cd.on .n{color:var(--blue)}
.cd.rest{opacity:.35}
.cd.t-upper .n{color:var(--text)}
.cd.t-lower .n{color:var(--text)}
.cd.t-cardio .n{color:var(--text)}

/* ═══ BANNER ═══ */
.banner{
  padding:16px 18px;border-radius:14px;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;
  position:relative;overflow:hidden;
}
.banner.upper{background:rgba(255,69,58,0.08);border:1px solid rgba(255,69,58,0.12)}
.banner.lower{background:rgba(10,132,255,0.08);border:1px solid rgba(10,132,255,0.12)}
.banner.cardio{background:rgba(255,159,10,0.08);border:1px solid rgba(255,159,10,0.12)}
.banner.rest{background:rgba(28,28,30,0.88);border:1px solid rgba(255,255,255,0.06)}
.banner .bt{font-size:15px;font-weight:700;letter-spacing:-0.2px}
.banner .bs{font-size:11px;color:var(--text2);margin-top:3px;font-weight:500}
.badge{
  font-size:10px;font-weight:700;padding:6px 14px;border-radius:20px;
  text-transform:uppercase;letter-spacing:1px;
}
.upper .badge{background:var(--red-dim);color:var(--red)}
.lower .badge{background:var(--blue-dim);color:var(--blue)}
.cardio .badge{background:var(--orange-dim);color:var(--orange)}
.rest .badge{background:var(--surface);color:var(--text3)}
.edit-btn{
  width:36px;height:36px;border-radius:10px;border:none;
  background:rgba(255,255,255,0.08);color:var(--text2);cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:all .25s;flex-shrink:0;
}
.edit-btn:hover{background:rgba(255,255,255,0.14);color:var(--text)}

/* ═══ EXERCISE CARDS ═══ */
.exlist{display:flex;flex-direction:column;gap:10px}
.exc{
  padding:16px;border-radius:14px;
  background:rgba(28,28,30,0.85);border:1px solid rgba(255,255,255,0.06);
  transition:background .15s,border-color .15s;
}
.exc:hover{background:rgba(38,38,42,0.9)}
.exc.done{border-color:rgba(48,209,88,.2);background:rgba(30,50,35,0.85)}
.exc.done:hover{background:rgba(35,55,40,0.9)}
.ex-top{display:flex;align-items:flex-start;gap:14px}
.chk{
  width:44px;height:44px;min-width:44px;border-radius:50%;
  border:none;background:transparent;
  position:relative;cursor:pointer;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  color:transparent;font-size:14px;font-weight:700;
}
.chk::before{
  content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);
  transition:all .2s;
}
.chk:hover::before{border-color:var(--green)}
.exc.done .chk::before{
  background:var(--green);border-color:var(--green);
}
.exc.done .chk{color:#000}
.ex-nm{font-weight:700;font-size:15px;flex:1;line-height:1.35;color:var(--text)}
.ex-meta{display:flex;gap:8px;margin-top:8px;margin-left:0;flex-wrap:wrap}
.ex-meta span{
  font-size:11px;color:var(--text2);background:rgba(118,118,128,0.2);
  padding:4px 10px;border-radius:6px;font-weight:500;
}
.ex-meta .v{color:var(--text);font-weight:700}
.ex-last{
  margin:8px 0 0 0;font-size:10px;color:var(--blue);font-weight:600;
  padding:6px 10px;background:var(--blue-dim);border-radius:var(--rxs);
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ex-inp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0 0}
.ex-sets{margin:10px 0 0 0}
.ex-sets-hdr{display:grid;grid-template-columns:24px 1fr 1fr;gap:6px;margin-bottom:4px}
.sets-lbl{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding-left:2px}
.ex-set-row{display:grid;grid-template-columns:24px 1fr 1fr;gap:6px;margin-bottom:4px;align-items:center}
.set-num{font-size:10px;color:var(--text3);font-weight:700;text-align:center}
.inp-g label{
  display:block;font-size:9px;color:var(--text3);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;font-weight:700;
}
.inp-g input{
  width:100%;padding:9px 10px;border-radius:8px;
  border:1px solid rgba(255,255,255,0.1);background:rgba(118,118,128,0.2);
  color:var(--text);font-size:14px;font-weight:500;
  transition:border-color .2s;
}
.inp-g input:focus{outline:none;border-color:var(--accent)}
.inp-g input::placeholder{color:var(--text3);font-weight:400}
.ex-prog{
  margin:8px 0 0 0;font-size:10px;color:var(--text2);font-weight:600;
  padding:5px 10px;background:var(--surface);border-radius:var(--rxs);
  display:inline-block;letter-spacing:.2px;
}

/* ═══ HISTORY ═══ */
.hist{display:none;flex-direction:column;gap:12px}
.hist.vis{display:flex}
.h-entry{
  padding:16px;border-radius:14px;background:rgba(28,28,30,0.88);
  border:1px solid rgba(255,255,255,0.06);
  
}
.h-date{
  font-size:13px;font-weight:600;
  color:var(--text);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;
}
.h-actions{display:flex;gap:4px;align-items:center}
.h-tag{
  font-family:'DM Sans',sans-serif;font-size:9px;font-weight:700;
  padding:4px 10px;border-radius:10px;letter-spacing:.3px;
}
.h-exs{display:flex;flex-direction:column;gap:2px}
.h-ex{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--surface);font-size:13px;
}
.h-ex:last-child{border:none}
.h-ex .nm{color:var(--text2);font-weight:500}
.h-ex .st{color:var(--text);font-weight:700}
.del-btn{
  background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,.2);color:var(--red);
  font-size:10px;padding:8px 12px;border-radius:8px;cursor:pointer;min-height:36px;
  font-family:'DM Sans',sans-serif;font-weight:700;transition:all .2s;
}
.del-btn:hover{background:var(--red-dim);border-color:var(--red)}
.h-edit-btn{
  background:rgba(96,165,250,0.08);border:1px solid rgba(96,165,250,.2);color:var(--blue);
  font-size:10px;padding:8px 12px;border-radius:8px;cursor:pointer;min-height:36px;
  font-family:'DM Sans',sans-serif;font-weight:700;transition:all .2s;
}
.h-edit-btn:hover{background:var(--blue-dim)}
.h-edit-row{
  display:grid;grid-template-columns:1fr 80px 60px;gap:6px;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--surface);font-size:13px;
}
.h-edit-row:last-child{border:none}
.h-edit-row .nm{color:var(--text2);font-size:12px;font-weight:500}
.h-edit-ex-name{font-size:12px;font-weight:600;color:var(--text2);padding:8px 0 3px;border-bottom:1px solid var(--surface)}
.h-edit-set{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px;align-items:center;padding:4px 0}
.h-edit-row input,.h-edit-set input{
  width:100%;padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,0.05);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;text-align:center;font-weight:600;
}
.h-edit-row input:focus{outline:none;border-color:var(--accent)}
.hist-io{display:flex;gap:8px;margin-bottom:12px}
.hist-io button{
  flex:1;padding:10px;border-radius:10px;font-family:'DM Sans',sans-serif;
  font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.hist-io .exp-btn{
  background:rgba(96,165,250,0.08);border:1px solid rgba(96,165,250,.2);color:var(--blue);
}
.hist-io .exp-btn:hover{background:var(--blue-dim)}
.hist-io .imp-btn{
  background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,.2);color:var(--green);
}
.hist-io .imp-btn:hover{background:rgba(52,211,153,0.15)}
.h-save-btn{
  margin-top:10px;width:100%;padding:10px;border:none;border-radius:var(--rxs);
  background:var(--accent);color:#fff;font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;
}
.h-save-btn:hover{opacity:0.85}

/* ═══ PROGRESS ═══ */
.prog{display:none;flex-direction:column;gap:14px}
.prog.vis{display:flex}
.p-card{
  padding:16px;border-radius:14px;background:rgba(28,28,30,0.88);
  border:1px solid rgba(255,255,255,0.06);
  
}
.p-card h3{font-size:14px;font-weight:600;margin-bottom:14px}
.p-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.p-stat{text-align:center;padding:16px;background:rgba(255,255,255,0.04);border-radius:16px;border:1px solid rgba(255,255,255,0.08)}
.p-stat .num{font-size:32px;font-weight:700;line-height:1}
.p-stat .lbl{font-size:10px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.ring-wrap{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.ring-info{flex:1}
.ring-info .nm{font-size:13px;font-weight:700;margin-bottom:4px}
.ring-info .det{font-size:11px;color:var(--text2)}
.ring-svg{width:58px;height:58px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--surface);stroke-width:5}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .8s ease}

/* ═══ RULES ═══ */
.rules{display:none;flex-direction:column;gap:12px}
.rules.vis{display:flex}
.r-card{
  padding:16px;border-radius:14px;background:rgba(28,28,30,0.88);
  border:1px solid rgba(255,255,255,0.06);
  
}
.r-card h3{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--text)}
.r-card li{font-size:13px;color:var(--text2);line-height:1.7;padding:3px 0 3px 20px;position:relative;list-style:none;font-weight:500}
.r-card li::before{
  content:'';position:absolute;left:0;top:11px;width:8px;height:8px;border-radius:50%;
  background:rgba(10,132,255,0.15);border:none;
}
.r-card ul{padding:0}

/* ═══ BOTTOM BAR ═══ */
.bbar{
  display:none;
  padding:20px 0 0;
}
.log-btn{
  width:100%;max-width:100%;margin:0 auto;display:block;
  padding:16px;border:none;border-radius:16px;
  font-size:16px;font-weight:600;
  background:var(--accent);color:#fff;cursor:pointer;transition:opacity .2s;
}
.log-btn:hover{opacity:0.85}
.log-btn:active{transform:scale(.97)}
.log-btn.saved{background:var(--green)}

/* ═══ TOAST ═══ */
.toast{
  position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-120px);
  z-index:999;padding:14px 28px;border-radius:16px;
  background:rgba(255,255,255,0.1);color:var(--text);font-weight:700;font-size:13px;
  box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,0.12);
  
  transition:transform .5s cubic-bezier(.34,1.56,.64,1);pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ═══ EMPTY ═══ */
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty .ico{margin-bottom:16px;opacity:.35;display:flex;justify-content:center}
.skip-rest-btn{
  margin-top:16px;padding:10px 24px;border-radius:var(--rs);border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.06);color:var(--text2);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .2s;
}
.skip-rest-btn:hover{background:rgba(255,255,255,0.1);color:var(--text)}
.empty p{font-size:13px;line-height:1.7;font-weight:500}

/* ═══ CREDIT ═══ */
.credit{text-align:center;padding:40px 0 20px;font-size:10px;color:var(--text3);letter-spacing:.5px;font-weight:500}
.credit a{color:var(--accent);text-decoration:none;font-weight:600}

/* ═══ EDIT PANEL ═══ */
.edit-panel{
  position:fixed;inset:0;z-index:600;background:var(--bg);
  transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;padding:0 16px 100px;-webkit-overflow-scrolling:touch;
}
.edit-panel.open{transform:translateY(0)}
.edit-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 0 16px;position:sticky;top:0;z-index:10;
  background:linear-gradient(to bottom,var(--bg) 60%,transparent);
  
}
.edit-hdr h2{font-size:17px;font-weight:600}
.edit-close{
  width:36px;height:36px;border-radius:50%;border:none;
  background:rgba(255,255,255,0.1);color:var(--text);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.edit-close:hover{background:rgba(255,255,255,0.15)}
.edit-ex{
  padding:16px;border-radius:14px;background:rgba(28,28,30,0.88);border:1px solid rgba(255,255,255,0.06);
  margin-bottom:10px;
}
.edit-ex-hdr{display:flex;align-items:center;margin-bottom:12px;gap:8px}
.edit-move{display:flex;flex-direction:column;gap:2px}
.edit-move-btn{
  width:28px;height:20px;border:none;border-radius:6px;
  background:rgba(255,255,255,0.08);color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .2s;
}
.edit-move-btn:hover{background:rgba(255,255,255,0.14);color:var(--text)}
.edit-move-btn.dis{opacity:0.2;pointer-events:none}
.edit-ex-hdr input{
  flex:1;padding:10px 12px;border-radius:var(--rxs);border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,0.05);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;
}
.edit-ex-hdr input:focus{outline:none;border-color:var(--accent)}
.edit-ex-del{
  width:38px;height:38px;border-radius:12px;border:1px solid rgba(248,113,113,.2);
  background:rgba(248,113,113,0.08);color:var(--red);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;
}
.edit-ex-del:hover{background:var(--red-dim);border-color:var(--red)}
.edit-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.edit-row.r2{grid-template-columns:1fr 1fr}
.edit-row label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;display:block;font-weight:700}
.edit-row input,.edit-row select{
  width:100%;padding:10px;border-radius:var(--rxs);border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,0.05);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;
}
.edit-row input:focus,.edit-row select:focus{outline:none;border-color:var(--accent)}
.edit-add{
  width:100%;padding:14px;border:2px dashed rgba(255,255,255,.1);border-radius:var(--r);
  background:transparent;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:13px;
  font-weight:700;cursor:pointer;transition:all .2s;margin-bottom:10px;
}
.edit-add:hover{border-color:var(--accent);color:var(--accent);background:rgba(10,132,255,0.06)}
.edit-save{
  width:100%;padding:15px;border:none;border-radius:16px;
  background:var(--accent);color:#fff;
  font-size:15px;font-weight:600;
  cursor:pointer;transition:opacity .2s;margin-top:10px;
}
.edit-save:hover{opacity:0.85}
.edit-save:active{transform:scale(.97)}
.edit-err{color:var(--red);font-size:12px;margin-top:8px;min-height:18px;text-align:center;font-weight:600}

/* ═══ MODAL ═══ */
.modal-bg{
  position:fixed;inset:0;z-index:700;background:rgba(0,0,0,.5);
  display:none;align-items:center;justify-content:center;padding:20px;
  
}
.modal-bg.show{display:flex}
.modal{
  background:rgba(28,28,30,0.9);border:1px solid rgba(255,255,255,0.08);border-radius:16px;
  padding:24px;width:100%;max-width:340px;
  -webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);
  animation:modalIn .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal h3{font-size:17px;font-weight:600;margin-bottom:8px}
.modal p{font-size:13px;color:var(--text2);line-height:1.5;font-weight:500}
.modal-btns{display:flex;gap:8px;margin-top:20px}
.modal-btns button{
  flex:1;padding:12px;border-radius:14px;border:none;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;
}
.m-cancel{background:var(--surface);color:var(--text2)}
.m-cancel:hover{background:rgba(255,255,255,.08)}
.m-danger{background:var(--red-dim);color:var(--red)}
.m-danger:hover{background:rgba(239,68,68,.15)}
.m-confirm-pos{background:var(--green-dim);color:var(--green)}
.m-confirm-pos:hover{background:rgba(48,209,88,.2)}

/* ═══ VALIDATION ═══ */
.inp-err{border-color:var(--red) !important;box-shadow:0 0 0 4px var(--red-dim) !important}
.err-msg{color:var(--red);font-size:10px;margin-top:2px;font-weight:600}

/* ═══ ANIMATIONS ═══ */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.exc,.h-entry,.p-card,.r-card{animation:fadeUp .5s cubic-bezier(.4,0,.2,1) both}
.exc:nth-child(1){animation-delay:.05s}.exc:nth-child(2){animation-delay:.1s}
.exc:nth-child(3){animation-delay:.15s}.exc:nth-child(4){animation-delay:.2s}
.exc:nth-child(5){animation-delay:.25s}.exc:nth-child(6){animation-delay:.3s}

@media(prefers-reduced-motion:reduce){
  .exc,.h-entry,.p-card,.r-card{animation:none}
  .toast{transition:none}
}

/* Prevent mobile auto-zoom on input focus (requires >= 16px) */
@media(max-width:767px){
  input,select,textarea{font-size:16px !important}
}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
</style>

let state=defState();
let auth=null,db=null,currentUser=null,userRef=null,guestMode=false;
const LS_LEGACY='gb_data';let lsKey='gb_data_guest'; // storage is per account so devices shared between accounts don't mix data

function defState(){return{currentCycleDay:1,cycleCount:1,sessions:{},todaySession:null,customWorkouts:{}}}
function safeDay(d){d=parseInt(d);return(d>=1&&d<=7)?d:1}
function dayInfo(d){return CYCLE[safeDay(d)-1]}
function getWorkouts(day){const c=state.customWorkouts&&state.customWorkouts[day];return Array.isArray(c)?c:(DEFAULT_WK[day]||[])}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function newSessionKey(){let k=fmtDate(new Date())+'_C'+state.cycleCount+'_D'+state.currentCycleDay;if(state.sessions[k])k+='_'+Date.now();return k}
function sessionTime(k,s){if(s&&s.date){const t=Date.parse(s.date);if(!isNaN(t))return t}const m=/^(\d{4}-\d{2}-\d{2})/.exec(k||'');return m?new Date(m[1]+'T00:00:00').getTime():0}
function sessionDate(k,s){return new Date(sessionTime(k,s))}
function hasSetData(ex){if(!ex)return false;if(Array.isArray(ex.sets))return ex.sets.some(s=>s&&(s.weight||s.reps));return !!(ex.loggedWeight||ex.loggedReps)}
function sessionHasData(s){return !!(s&&Array.isArray(s.exercises)&&s.exercises.some(hasSetData))}
function hasCompleted(s){return !!(s&&Array.isArray(s.exercises)&&s.exercises.some(e=>e&&e.completed))}
// Conflict score for merging the same session from two devices: logged beats unlogged, then more typed sets, then more checkmarks.
function sessionScore(s){
  if(!s||!Array.isArray(s.exercises))return 0;
  let sets=0,comp=0;
  s.exercises.forEach(e=>{if(!e)return;if(e.completed)comp++;if(Array.isArray(e.sets))sets+=e.sets.filter(x=>x&&(x.weight||x.reps)).length;else if(e.loggedWeight||e.loggedReps)sets++});
  return(s.logged?1e6:0)+sets*100+comp;
}
function isActiveFor(s,cc,cd){return !!(s&&!s.logged&&s.cycleCount===cc&&s.cycleDay===cd)}

// Coerce anything loaded from localStorage/Firebase into a valid shape.
function normalize(s){
  if(!s||typeof s!=='object')s=defState();
  if(!s.sessions||typeof s.sessions!=='object')s.sessions={};
  if(!s.customWorkouts||typeof s.customWorkouts!=='object')s.customWorkouts={};
  s.cycleCount=Math.max(1,parseInt(s.cycleCount)||1);
  s.currentCycleDay=safeDay(s.currentCycleDay);
  if(typeof s.todaySession!=='string')s.todaySession=null;
  Object.keys(s.sessions).forEach(k=>{
    const x=s.sessions[k];
    if(!x||typeof x!=='object'){delete s.sessions[k];return}
    x.cycleDay=safeDay(x.cycleDay);x.cycleCount=Math.max(1,parseInt(x.cycleCount)||1);
    // Firebase can return sparse arrays with null holes — drop them once here so no render path has to care.
    x.exercises=(Array.isArray(x.exercises)?x.exercises:[]).filter(e=>e&&typeof e==='object');
    x.exercises.forEach(e=>{if(e.sets!=null)e.sets=(Array.isArray(e.sets)?e.sets:[]).filter(st=>st&&typeof st==='object')});
    // Data written before the explicit flag existed: every past/archived session with a checkmark
    // was shown as logged, so keep it that way; the active session is in-progress.
    if(typeof x.logged!=='boolean')x.logged=k!==s.todaySession&&hasCompleted(x);
  });
  return s;
}

// ═══ SESSION ═══
// The active session is identified by cycle position (cycle N, day D) + "not logged yet", never by date.
// So closing, refreshing, crossing midnight or switching days and back always brings the same numbers back.
function initSession(){
  const cc=state.cycleCount,cd=state.currentCycleDay;
  let key=state.todaySession;
  if(!isActiveFor(state.sessions[key],cc,cd)){
    const cands=Object.keys(state.sessions).filter(k=>isActiveFor(state.sessions[k],cc,cd));
    cands.sort((a,b)=>(sessionHasData(state.sessions[b])-sessionHasData(state.sessions[a]))||(sessionTime(b,state.sessions[b])-sessionTime(a,state.sessions[a])));
    key=cands[0]||null;
  }
  if(!key){
    key=newSessionKey();
    state.sessions[key]={date:new Date().toISOString(),cycleDay:cd,cycleCount:cc,dayName:dayInfo(cd).name,logged:false,exercises:[]};
  }
  state.todaySession=key;
  reconcileWithPlan(state.sessions[key]);
  pruneEmptySessions();
}
function pruneEmptySessions(){
  Object.keys(state.sessions).forEach(k=>{
    if(k===state.todaySession)return;
    const s=state.sessions[k];
    if(!s.logged&&!sessionHasData(s)&&!hasCompleted(s))delete state.sessions[k];
  });
}
function buildExercise(ex,last,old){
  const le=last?last.exercises.find(e=>e&&e.name===ex.n&&e.completed):null;
  const n=parseInt(ex.s);const numSets=ex.u===''?Math.max(n||0,0):(n||1);
  const sets=[];
  for(let si=0;si<numSets;si++){
    let o=null;
    if(old){if(Array.isArray(old.sets))o=old.sets[si];else if(si===0&&(old.loggedWeight||old.loggedReps))o={weight:old.loggedWeight,reps:old.loggedReps}}
    sets.push({weight:o&&o.weight!=null?String(o.weight):'',reps:o&&o.reps!=null?String(o.reps):''});
  }
  const lw=le&&Array.isArray(le.sets)&&le.sets[0]?parseFloat(le.sets[0].weight):NaN;
  return{name:ex.n,targetSets:ex.s,targetReps:ex.r,rest:ex.rest,startWeight:isNaN(lw)?ex.w:lw,originalWeight:ex.w,unit:ex.u,progression:ex.p,sets:sets,completed:!!(old&&old.completed)};
}
// Align the active session with the current plan for its day, keeping any typed data by exercise name.
function reconcileWithPlan(s){
  const plan=getWorkouts(s.cycleDay),last=lastSession(s.cycleDay),old=Array.isArray(s.exercises)?s.exercises:[];
  s.exercises=plan.map(ex=>buildExercise(ex,last,old.find(e=>e&&e.name===ex.n)));
  s.dayName=dayInfo(s.cycleDay).name;
}
function lastSession(cd){
  cd=safeDay(cd);const dayName=dayInfo(cd).name;let best=null,bt=-1;
  Object.keys(state.sessions).forEach(k=>{
    const s=state.sessions[k];if(!s||!s.logged)return;
    if(s.cycleDay!==cd&&s.dayName!==dayName)return;
    const t=sessionTime(k,s);if(t>bt){bt=t;best=s}
  });
  return best;
}
function advanceDay(){const next=state.currentCycleDay>=7?1:state.currentCycleDay+1;if(next===1)state.cycleCount=(state.cycleCount||1)+1;state.currentCycleDay=next}
function validateSession(sess){
  const w=[];
  sess.exercises.forEach(ex=>{
    if(!ex.completed||!Array.isArray(ex.sets)||!ex.sets.length)return;
    let hasAnyData=false;
    ex.sets.forEach((s,si)=>{
      if(s.weight||s.reps)hasAnyData=true;
      if(s.weight&&(isNaN(parseFloat(s.weight))||parseFloat(s.weight)<0||parseFloat(s.weight)>999))w.push(`${ex.name} S${si+1}: invalid weight`);
      if(s.reps&&(isNaN(parseInt(s.reps))||parseInt(s.reps)<0||parseInt(s.reps)>999))w.push(`${ex.name} S${si+1}: invalid reps`);
    });
    if(ex.unit!==''&&!hasAnyData)w.push(`${ex.name}: add data for at least one set`);
  });
  return w;
}

// STORAGE + SYNC
// ═══════════════════════════════════════════════
let fbReady=false;        // blocks Firebase writes until the first snapshot arrives (never overwrite cloud data with an empty local state)
let _writeCount=0;        // our own writes echo back through the listener; skip exactly that many snapshots
let _listenCount=0;
let _fbListener=null,_fbListenerRef=null,_saveTimer=null,_localTimer=null;

function setStorageKey(k){
  if(_localTimer)persistLocal(); // anything pending belongs to the previous account/guest key
  lsKey=k;
  try{ // one-time adoption of the pre-per-account storage key
    if(localStorage.getItem(k)===null){const legacy=localStorage.getItem(LS_LEGACY);if(legacy!==null){localStorage.setItem(k,legacy);localStorage.removeItem(LS_LEGACY)}}
  }catch(e){}
}
function loadLocal(){
  try{const r=localStorage.getItem(lsKey);if(r)return normalize(JSON.parse(r))}catch(e){}
  return normalize(defState());
}
function persistLocal(){clearTimeout(_localTimer);_localTimer=null;try{localStorage.setItem(lsKey,JSON.stringify(state))}catch(e){}}
function persistLocalSoon(){if(!_localTimer)_localTimer=setTimeout(persistLocal,150)} // coalesces a burst of keystrokes into one serialization
function pushRemote(){
  if(guestMode||!fbReady||!userRef)return;
  clearTimeout(_saveTimer);_saveTimer=null;
  _writeCount++;setSync('s');
  // round-trip through JSON: Firebase rejects undefined values synchronously
  userRef.set(JSON.parse(JSON.stringify(state))).then(()=>setSync('ok')).catch(()=>setSync('off'));
}
// Local storage is written within 150ms of any change and flushed synchronously on pagehide/visibilitychange
// (what a refresh, tab close or app switch fires), so a refresh never loses typed numbers. Cloud writes are debounced 1s.
function saveState(immediate){
  if(immediate)persistLocal();else persistLocalSoon();
  if(guestMode||!fbReady||!userRef)return;
  if(immediate){pushRemote();return}
  clearTimeout(_saveTimer);_saveTimer=setTimeout(pushRemote,1000);
}
function flushPendingSave(){persistLocal();if(_saveTimer)pushRemote()}
window.addEventListener('pagehide',flushPendingSave);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushPendingSave()});

function mergeSessions(local,remote){
  const merged=Object.assign({},remote);
  Object.keys(local).forEach(k=>{if(!merged[k]||sessionScore(local[k])>sessionScore(merged[k]))merged[k]=local[k]});
  return merged;
}
function runPplMigration(obj){
  // One-time migration from the pre-PPL plan: drop stale custom workouts and an empty active session.
  if(obj._pplMigrated)return;
  obj.customWorkouts={};
  const k=obj.todaySession;if(k&&obj.sessions[k]&&sessionScore(obj.sessions[k])===0)delete obj.sessions[k];
  obj._pplMigrated=true;
}
function loadFromFirebase(){
  fbReady=false;
  state=loadLocal();runPplMigration(state);initSession();persistLocal();render();hideLoading();
  setSync('s');
  if(_fbListener&&_fbListenerRef)_fbListenerRef.off('value',_fbListener);
  const ref=userRef;_fbListenerRef=ref;_writeCount=0;_listenCount=0;
  _fbListener=ref.on('value',snap=>{
    if(ref!==userRef)return; // account changed while this snapshot was in flight
    if(_listenCount<_writeCount){_listenCount++;setSync('ok');return} // echo of our own write
    const isInitial=!fbReady,d=snap.val();
    if(d&&typeof d==='object'){
      const fb=normalize(d);runPplMigration(fb);
      if(isInitial){
        // merge offline work into the cloud copy; nothing is dropped
        fb.sessions=mergeSessions(state.sessions,fb.sessions);
        fb.customWorkouts=Object.assign({},state.customWorkouts,fb.customWorkouts);
      } else {
        // another device wrote: keep our in-progress session if it holds more than the cloud copy
        const ak=state.todaySession,ls=ak?state.sessions[ak]:null;
        if(ls&&!ls.logged&&sessionScore(ls)>sessionScore(fb.sessions[ak]))fb.sessions[ak]=ls;
      }
      state=fb;
    }
    initSession();persistLocal();
    if(isInitial){fbReady=true;pushRemote()}
    render();setSync('ok');
  },()=>{fbReady=true;setSync('off')}); // listener error/offline: keep working locally
}
function hideLoading(){$('appLoading').style.display='none';$('cycleBar').style.display='';document.querySelectorAll('.tabs').forEach(t=>t.style.display='')}
function setSync(s){const d=$('syncDot');d.className='sync'+(s==='s'?' s':s==='off'?' off':'');const t=s==='ok'?'Synced':s==='s'?'Syncing...':'Offline';d.title=t;d.setAttribute('aria-label',t)}

    // ticking adopts last session's numbers for empty sets — but only real numbers, never "6-8" / "AMRAP" / "BW"
    card.querySelectorAll('.ex-sets input').forEach(inp=>{
      if(inp.value||!NUM_RE.test(inp.placeholder))return;
      const set=ex.sets[parseInt(inp.dataset.si)];if(!set)return;
      inp.value=inp.placeholder;
      if(inp.dataset.f==='w')set.weight=inp.placeholder;else set.reps=inp.placeholder;
    });
  }
  saveState(true);
}
function onSetInput(inp){
  const sess=state.sessions[state.todaySession];if(!sess)return;
  const ex=sess.exercises[parseInt(inp.dataset.i)],si=parseInt(inp.dataset.si);
  if(!ex||!ex.sets[si])return;
  if(inp.dataset.f==='w')ex.sets[si].weight=inp.value;else ex.sets[si].reps=inp.value;
  // auto-tick when every set has reps, auto-untick when they're all cleared (no re-render, keeps focus)
  const card=inp.closest('.exc'),chk=card?card.querySelector('.chk'):null;
  const filled=s=>String(s.reps||'').trim()!=='';
  if(!ex.completed&&ex.sets.every(filled))setCompleted(ex,card,chk,true);
  else if(ex.completed&&!ex.sets.some(filled))setCompleted(ex,card,chk,false);
  saveState();
}

// ═══ HISTORY EXPORT/IMPORT (XLSX library is fetched on first use) ═══
let _xlsxPromise=null;
function withXLSX(fn){
  if(typeof XLSX!=='undefined'){fn();return}
  if(!_xlsxPromise){
    showToast('Loading spreadsheet tools...');
    _xlsxPromise=new Promise((res,rej)=>{
      const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.crossOrigin='anonymous';
      s.onload=res;s.onerror=()=>{_xlsxPromise=null;rej(new Error('xlsx load failed'))};document.head.appendChild(s);
    });
  }
  _xlsxPromise.then(fn).catch(()=>showToast('Could not load spreadsheet tools — check your connection'));
}
function exportHistory(){
  const rows=[];
  loggedKeys().reverse().forEach(key=>{
    const s=state.sessions[key];
    const date=sessionDate(key,s).toLocaleDateString('en-US',{year:'numeric',month:'2-digit',day:'2-digit'});
    s.exercises.filter(e=>e.completed).forEach(e=>{
      const base={Date:date,Day:s.cycleDay,DayName:s.dayName||'',Cycle:s.cycleCount||1,Exercise:e.name};
      if(Array.isArray(e.sets)&&e.sets.length)e.sets.forEach((st,si)=>rows.push(Object.assign({},base,{Set:si+1,Weight:st.weight||'',Reps:st.reps||'',Unit:e.unit||'kg'})));
      else rows.push(Object.assign({},base,{Set:1,Weight:e.loggedWeight||'',Reps:e.loggedReps||'',Unit:e.unit||'kg'}));
    });
  });
  if(!rows.length){showToast('No sessions to export');return}
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:12},{wch:5},{wch:18},{wch:6},{wch:28},{wch:5},{wch:8},{wch:6},{wch:5}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'History');
  XLSX.writeFile(wb,'GymBuddy_History.xlsx');
  showToast('Exported '+rows.length+' rows');
}
// Dates come back as Date objects, Excel serials or text depending on how the sheet was saved.
function parseRowDate(v){
  if(v instanceof Date)return isNaN(v)?null:v;
  if(typeof v==='number'){const o=XLSX.SSF.parse_date_code(v);return o?new Date(o.y,o.m-1,o.d):null}
  if(v==null||v==='')return null;
  const d=new Date(String(v));return isNaN(d)?null:d;
}
function importHistory(file){
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      if(!rows.length){showToast('Empty file');return}
      const missing=['Date','Exercise','Set','Weight','Reps'].filter(r=>!(r in rows[0]));
      if(missing.length){showToast('Missing columns: '+missing.join(', '));return}
      const grouped={};
      rows.forEach(r=>{
        const dp=parseRowDate(r.Date);if(!dp)return;
        const day=safeDay(r.Day),cycle=Math.max(1,parseInt(r.Cycle)||1);
        const skey=fmtDate(dp)+'_C'+cycle+'_D'+day; // local date, so nothing shifts a day across timezones
        if(!grouped[skey])grouped[skey]={date:dp.toISOString(),cycleDay:day,cycleCount:cycle,dayName:String(r.DayName||dayInfo(day).name).slice(0,40),exercises:{}};
        const exName=String(r.Exercise).slice(0,80);
        if(!grouped[skey].exercises[exName])grouped[skey].exercises[exName]={name:exName,unit:String(r.Unit==null?'kg':r.Unit).slice(0,10),sets:[]};
        grouped[skey].exercises[exName].sets.push({weight:String(r.Weight==null?'':r.Weight),reps:String(r.Reps==null?'':r.Reps)});
      });
      let imported=0;
      Object.keys(grouped).forEach(skey=>{
        if(state.sessions[skey])return; // duplicates skipped
        const g=grouped[skey];
        state.sessions[skey]={date:g.date,cycleDay:g.cycleDay,cycleCount:g.cycleCount,dayName:g.dayName,logged:true,
          exercises:Object.values(g.exercises).map(ex=>({name:ex.name,targetSets:ex.sets.length,targetReps:'',rest:'',startWeight:0,originalWeight:0,unit:ex.unit,progression:'',sets:ex.sets,completed:true}))};
        imported++;
      });
      if(imported>0){initSession();saveState(true);render()}
      showToast(imported>0?'Imported '+imported+' sessions':'No new sessions (duplicates skipped)');
    }catch(err){showToast('Error reading file')}
  };
  reader.onerror=()=>showToast('Error reading file');
  reader.readAsArrayBuffer(file);
}

// ═══ PROGRESS ═══
function renderProgress(){
  const p=$('progressTab'),names=new Set(),keys=loggedKeys().reverse(); // oldest → newest
  for(let d=1;d<=7;d++){getWorkouts(d).forEach(e=>{if(e.w>0)names.add(e.n)})}
  keys.forEach(k=>{state.sessions[k].exercises.forEach(e=>{
    if(!e.completed)return;
    if(Array.isArray(e.sets)?e.sets.some(s=>s&&parseFloat(s.weight)>0):parseFloat(e.loggedWeight)>0)names.add(e.name);
  })});
  const pd=[];
  names.forEach(name=>{
    const logs=[];
    keys.forEach(k=>{
      const ex=state.sessions[k].exercises.find(e=>e.name===name&&e.completed);if(!ex)return;
      const maxW=Array.isArray(ex.sets)&&ex.sets.length?Math.max(...ex.sets.map(s=>parseFloat(s&&s.weight)||0)):(parseFloat(ex.loggedWeight)||0);
      if(maxW>0)logs.push(maxW);
    });
    if(!logs.length)return;
    let sw=0,unit='kg';
    for(let d=1;d<=7;d++){const f=getWorkouts(d).find(e=>e.n===name);if(f){sw=f.w;unit=f.u||'kg';break}}
    const cw=logs[logs.length-1];
    pd.push({name,sw,cw,change:Math.round((cw-sw)*100)/100,sess:logs.length,unit});
  });
  if(!pd.length){p.innerHTML=`<div class="empty"><div class="ico"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div><p>Log sessions to see progression.</p></div>`;return}
  const circ=2*Math.PI*22;
  p.innerHTML=`<div class="p-card"><h3>Overview</h3><div class="p-stats"><div class="p-stat"><div class="num" style="color:var(--accent)">${keys.length}</div><div class="lbl">Sessions</div></div><div class="p-stat"><div class="num" style="color:var(--accent2)">${pd.length}</div><div class="lbl">Exercises</div></div></div></div>
    ${pd.map(x=>{const pct=x.sw>0?Math.min(100,Math.max(5,(x.cw/(x.sw*1.5))*100)):50;const off=circ-(circ*pct/100);const cs=x.change>=0?`+${x.change}`:`${x.change}`;const cc=x.change>=0?'var(--green)':'var(--red)';
      return`<div class="p-card"><div class="ring-wrap"><svg class="ring-svg" viewBox="0 0 56 56" aria-hidden="true"><circle class="ring-bg" cx="28" cy="28" r="22"/><circle class="ring-fg" cx="28" cy="28" r="22" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/></svg><div class="ring-info"><div class="nm">${esc(x.name)}</div><div class="det">Start: ${esc(x.sw)} ${esc(x.unit)} &rarr; Now: <strong>${esc(x.cw)} ${esc(x.unit)}</strong> <span style="color:${cc}">(${cs})</span></div><div class="det">${x.sess} session${x.sess>1?'s':''}</div></div></div></div>`}).join('')}`;
}

      <button class="edit-ex-del" data-i="${i}" aria-label="Delete exercise"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    </div>
    <div class="edit-row"><div><label>Sets</label><input type="number" value="${esc(ex.s)}" data-i="${i}" data-f="s" min="0" max="20" placeholder="3"></div><div><label>Reps</label><input type="text" value="${esc(ex.r)}" data-i="${i}" data-f="r" placeholder="8-12" maxlength="20"></div><div><label>Rest</label><input type="text" value="${esc(ex.rest)}" data-i="${i}" data-f="rest" placeholder="60s" maxlength="10"></div></div>
    <div class="edit-row r2"><div><label>Weight</label><input type="number" value="${esc(ex.w)}" data-i="${i}" data-f="w" min="0" step="0.5"></div><div><label>Unit</label><select data-i="${i}" data-f="u"><option value="kg" ${ex.u==='kg'?'selected':''}>kg</option><option value="BW" ${ex.u==='BW'?'selected':''}>BW</option><option value="lbs" ${ex.u==='lbs'?'selected':''}>lbs</option><option value="" ${ex.u===''?'selected':''}>None</option></select></div></div>
    <div class="edit-row"><div style="grid-column:1/-1"><label>Progression</label><input type="text" value="${esc(ex.p)}" data-i="${i}" data-f="p" placeholder="+5 kg when 12 reps" maxlength="80"></div></div>
  </div>`).join('');
}
$('editContent').addEventListener('click',e=>{
  if(!editDraft)return;
  const mv=e.target.closest('.edit-move-btn:not(.dis)');
  if(mv){
    readEditDraft();
    const i=parseInt(mv.dataset.i),j=mv.dataset.dir==='up'?i-1:i+1;
    if(j<0||j>=editDraft.length)return;
    [editDraft[i],editDraft[j]]=[editDraft[j],editDraft[i]];
    renderEditExercises();
    const cards=$('editContent').querySelectorAll('.edit-ex');if(cards[j])cards[j].scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  const del=e.target.closest('.edit-ex-del');
  if(del){
    if(editDraft.length<=1){$('editErr').textContent='Add another exercise first.';return}
    const i=parseInt(del.dataset.i);
    showModal('Delete Exercise','Remove this exercise?',()=>{if(!editDraft)return;readEditDraft();editDraft.splice(i,1);$('editErr').textContent='';renderEditExercises()});
  }
});
$('editAdd').addEventListener('click',()=>{
  if(!editDraft)return;
  readEditDraft();editDraft.push({n:"New Exercise",s:3,r:"8-12",rest:"60s",w:0,u:"kg",p:""});renderEditExercises();
  const panel=$('editPanel');panel.scrollTop=panel.scrollHeight;
  const last=$('editContent').querySelector('.edit-ex:last-child [data-f="n"]');if(last){last.focus();last.select()}
});
$('editSave').addEventListener('click',()=>{
  if(!editDraft)return;
  const c=$('editContent'),errEl=$('editErr');errEl.textContent='';
  c.querySelectorAll('.inp-err').forEach(el=>el.classList.remove('inp-err'));c.querySelectorAll('.err-msg').forEach(el=>el.remove());
  readEditDraft();
  const newList=normPlan(editDraft);let hasErr=false;
  c.querySelectorAll('.edit-ex').forEach((card,i)=>{
    const ex=newList[i],nI=card.querySelector('[data-f="n"]'),sI=card.querySelector('[data-f="s"]'),rI=card.querySelector('[data-f="r"]'),wI=card.querySelector('[data-f="w"]');
    if(!ex.n){nI.classList.add('inp-err');hasErr=true;addErrMsg(nI,'Required')}
    if(!ex.r){rI.classList.add('inp-err');hasErr=true;addErrMsg(rI,'Required')}
    if(ex.s<0||ex.s>20){sI.classList.add('inp-err');hasErr=true;addErrMsg(sI,'0-20')}
    if(ex.w<0||ex.w>999){wI.classList.add('inp-err');hasErr=true;addErrMsg(wI,'0-999')}
  });
  if(hasErr){errEl.textContent='Fix errors above.';return}
  if(!state.customWorkouts)state.customWorkouts={};
  state.customWorkouts[editingDay]=newList;
  initSession(); // re-align the active session with the new plan (typed data is kept by exercise name)
  saveState(true);render();closeEditPanel();showToast('Workout updated!');
});
function addErrMsg(inp,msg){const el=document.createElement('div');el.className='err-msg';el.textContent=msg;inp.parentElement.appendChild(el)}

// ═══ UTILS ═══
let _toastTimer=null;
function showToast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
let modalCb=null;
function showModal(title,text,cb,opts){
  $('modalTitle').textContent=title;$('modalText').textContent=text;
  const btn=$('modalConfirm');
  btn.textContent=(opts&&opts.confirmText)||'Confirm';
  btn.className=(opts&&opts.positive)?'m-confirm-pos':'m-danger';
  $('modal').classList.add('show');modalCb=cb;
}
function hideModal(){$('modal').classList.remove('show');modalCb=null}
$('modalCancel').addEventListener('click',hideModal);
$('modalConfirm').addEventListener('click',()=>{const cb=modalCb;hideModal();if(cb)cb()});
$('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)hideModal()}); // tap outside to cancel
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
  if($('modal').classList.contains('show'))hideModal();
  else if($('editPanel').classList.contains('open'))requestCloseEdit();
});
function fmtRest(r){if(!r||r==='-')return r;const n=parseInt(r);if(isNaN(n))return r;if(n>=120)return(n/60)+'min';if(n>=60)return Math.floor(n/60)+':'+(''+(n%60)).padStart(2,'0');return r}
const ESC_MAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){return s==null?'':String(s).replace(/[&<>"']/g,c=>ESC_MAP[c])}
$('copyYear').textContent=new Date().getFullYear();

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
</body>
</html>
